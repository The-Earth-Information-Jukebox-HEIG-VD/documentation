site_name: Earth Information Jukebox
site_description: Transforming NASA climate data into accessible audio
site_url: https://the-earth-information-jukebox-heig-vd.github.io/documentation
repo_url: https://github.com/The-Earth-Information-Jukebox-HEIG-VD/documentation
repo_name: Earth-Jukebox/documentation

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - About:
    - Project: about/project.md
    - Team: about/team.md
    - Mission: about/mission.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Prerequisites: getting-started/prerequisites.md
    - Development Setup: getting-started/development.md
  - Architecture:
    - Overview: architecture/overview.md
    - Frontend: architecture/frontend.md
    - Backend: architecture/backend.md
    - Sonification: architecture/sonification.md
    - Deployment: architecture/deployment.md
  - User Guide:
    - Using the App: user-guide/using-the-app.md
    - Accessibility: user-guide/accessibility.md
  - Developer Guide:
    - Frontend: developer-guide/frontend.md
    - Backend: developer-guide/backend.md
    - Sonification: developer-guide/sonification.md
    - Testing: developer-guide/testing.md
    - Contributing: developer-guide/contributing.md
  - API Reference: api/reference.md
  - Deployment:
    - Docker: deployment/docker.md
    - Production: deployment/production.md
    - CI/CD: deployment/ci-cd.md
  - Data:
    - Sources: data/sources.md
    - Formats: data/formats.md
    - Processing: data/processing.md
  - Appendix:
    - Glossary: appendix/glossary.md
    - FAQ: appendix/faq.md
    - Roadmap: appendix/roadmap.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/The-Earth-Information-Jukebox-HEIG-VD
