site_name: Earth Information Jukebox
site_description: Transforming NASA climate data into accessible audio
site_url: https://the-earth-information-jukebox-heig-vd.github.io/documentation
# Port 8000 is reserved for the sonification API (the webapp proxies /api there)
dev_addr: 127.0.0.1:8001
repo_url: https://github.com/The-Earth-Information-Jukebox-HEIG-VD/documentation
repo_name: Earth-Jukebox/documentation

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - About:
    - Project: about/project.md
    - Team: about/team.md
    - Mission: about/mission.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Prerequisites: getting-started/prerequisites.md
    - Development Setup: getting-started/development.md
  - Development:
    - Overview: development/overview.md
    - Frontend: development/frontend.md
    - Backend: development/backend.md
    - Sonification: development/sonification.md
    - Testing: development/testing.md
    - Contributing: development/contributing.md
  - User Guide:
    - Using the App: user-guide/using-the-app.md
    - Accessibility: user-guide/accessibility.md
  - API Reference: api/reference.md
  - Deployment:
    - Docker: deployment/docker.md
    - Production: deployment/production.md
    - CI/CD: deployment/ci-cd.md
  - Appendix:
    - Glossary: appendix/glossary.md
    - FAQ: appendix/faq.md
    - Roadmap: appendix/roadmap.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/The-Earth-Information-Jukebox-HEIG-VD
